<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sam Personal Tracker</title>
  <style>
    /* CSS: Controls how the app looks */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f7f9;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 32px 16px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    .header {
      margin-bottom: 20px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .theme-btn {
      padding: 6px 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: 999px;
      background: #f8fafc;
      color: #475569;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .theme-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      color: #0f766e;
      background: #ccfbf1;
      padding: 4px 10px;
      border-radius: 999px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #64748b;
    }

    .progress-wrap {
      margin-bottom: 20px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 8px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #14b8a6;
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .add-input {
      flex: 1;
      padding: 11px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      color: #1e293b;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .add-input:focus {
      border-color: #14b8a6;
    }

    .add-btn {
      padding: 11px 18px;
      background-color: #14b8a6;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.15s ease;
      flex-shrink: 0;
    }

    .add-btn:hover {
      background-color: #0d9488;
    }

    .filter-tabs {
      display: flex;
      gap: 6px;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 14px;
    }

    .filter-btn {
      flex: 1;
      padding: 7px 10px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: #64748b;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    .filter-btn:hover {
      color: #0f172a;
    }

    .filter-btn.active {
      background: #ffffff;
      color: #0f172a;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }

    .habit-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .habit-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .delete-btn {
      width: 36px;
      height: 46px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      background: #ffffff;
      color: #94a3b8;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
    }

    .delete-btn:hover {
      color: #ef4444;
      border-color: #fecaca;
      background-color: #fef2f2;
    }

    .edit-btn {
      width: 36px;
      height: 46px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      background: #ffffff;
      color: #64748b;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
    }

    .edit-btn:hover {
      color: #0f766e;
      border-color: #99f6e4;
      background-color: #f0fdfa;
    }

    .edit-form {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .edit-input {
      flex: 1;
      padding: 11px 12px;
      border: 1.5px solid #14b8a6;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      color: #1e293b;
      background: #ffffff;
      outline: none;
    }

    .save-edit-btn,
    .cancel-edit-btn {
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      flex-shrink: 0;
    }

    .save-edit-btn {
      border: none;
      background: #14b8a6;
      color: #ffffff;
    }

    .save-edit-btn:hover {
      background: #0d9488;
    }

    .cancel-edit-btn {
      border: 1.5px solid #cbd5e1;
      background: #ffffff;
      color: #475569;
    }

    .cancel-edit-btn:hover {
      background: #f8fafc;
    }

    .empty-state {
      text-align: center;
      padding: 20px 12px;
      color: #64748b;
      font-size: 14px;
      border: 1.5px dashed #cbd5e1;
      border-radius: 12px;
    }

    .habit-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      background: #ffffff;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      width: 100%;
      text-align: left;
      font-family: inherit;
    }

    .habit-item:hover {
      background-color: #f8fafc;
      border-color: #cbd5e1;
    }

    .habit-item.done {
      background-color: #f0fdfa;
      border-color: #99f6e4;
    }

    .checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .habit-item.done .checkbox {
      background-color: #14b8a6;
      border-color: #14b8a6;
    }

    .habit-name {
      font-size: 16px;
      font-weight: 500;
      color: #1e293b;
      flex: 1;
    }

    .streak-pill {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #64748b;
      flex-shrink: 0;
    }

    .streak-pill.active {
      background: #fef3c7;
      color: #b45309;
    }

    .habit-item.done .habit-name {
      text-decoration: line-through;
      color: #64748b;
    }

    .celebration {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #ecfdf5;
      color: #065f46;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      display: none;
    }

    .celebration.visible {
      display: block;
    }

    .alarm-banner {
      margin-bottom: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #fef3c7;
      border: 1.5px solid #fcd34d;
      color: #92400e;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .alarm-banner.visible {
      display: flex;
    }

    .alarm-banner-text {
      font-size: 14px;
      font-weight: 600;
    }

    .dismiss-alarm-btn {
      padding: 6px 12px;
      border: none;
      border-radius: 8px;
      background: #d97706;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      flex-shrink: 0;
    }

    .dismiss-alarm-btn:hover {
      background: #b45309;
    }

    .reminders-section {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #f1f5f9;
    }

    .reminders-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .reminders-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
    }

    .notify-btn {
      padding: 5px 10px;
      border: 1.5px solid #cbd5e1;
      border-radius: 999px;
      background: #f8fafc;
      color: #475569;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    .notify-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
    }

    .reminder-form {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .reminder-label-input {
      flex: 1;
      min-width: 150px;
      padding: 9px 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      color: #1e293b;
      outline: none;
    }

    .reminder-label-input:focus,
    .reminder-time-input:focus {
      border-color: #14b8a6;
    }

    .reminder-time-input {
      padding: 9px 10px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      color: #1e293b;
      background: #ffffff;
      outline: none;
    }

    .reminder-add-btn {
      padding: 9px 14px;
      background: #0f766e;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    .reminder-add-btn:hover {
      background: #115e59;
    }

    .reminder-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .reminder-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      background: #f8fafc;
    }

    .reminder-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .reminder-time-badge {
      font-size: 13px;
      font-weight: 700;
      color: #0f766e;
      background: #ccfbf1;
      padding: 3px 8px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .reminder-name {
      font-size: 14px;
      font-weight: 500;
      color: #1e293b;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .reminder-item.paused .reminder-name,
    .reminder-item.paused .reminder-time-badge {
      opacity: 0.5;
    }

    .reminder-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .reminder-toggle-btn,
    .reminder-cal-btn {
      padding: 5px 9px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      color: #475569;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    .reminder-cal-btn:hover {
      border-color: #14b8a6;
      color: #0f766e;
    }

    .reminder-del-btn {
      width: 28px;
      height: 28px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      background: #ffffff;
      color: #94a3b8;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reminder-del-btn:hover {
      color: #ef4444;
      border-color: #fecaca;
      background: #fef2f2;
    }

    .reminder-empty {
      font-size: 13px;
      color: #94a3b8;
      text-align: center;
      padding: 8px 0;
    }

    .footer-actions {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .save-status {
      font-size: 12px;
      color: #94a3b8;
    }

    .reset-btn {
      padding: 8px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      color: #475569;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .reset-btn:hover:not(:disabled) {
      background: #f8fafc;
      border-color: #94a3b8;
      color: #0f172a;
    }

    .reset-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Dark mode theme overrides */
    body.dark {
      background-color: #0f172a;
      color: #f1f5f9;
    }

    body.dark .card {
      background: #1e293b;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    }

    body.dark h1 {
      color: #f8fafc;
    }

    body.dark .subtitle,
    body.dark .save-status {
      color: #94a3b8;
    }

    body.dark .badge {
      background: #134e4a;
      color: #5eead4;
    }

    body.dark .theme-btn {
      background: #334155;
      border-color: #475569;
      color: #e2e8f0;
    }

    body.dark .theme-btn:hover {
      background: #475569;
      color: #ffffff;
    }

    body.dark .progress-label {
      color: #cbd5e1;
    }

    body.dark .progress-bar-bg {
      background: #334155;
    }

    body.dark .add-input {
      background: #0f172a;
      border-color: #334155;
      color: #f8fafc;
    }

    body.dark .add-input::placeholder {
      color: #64748b;
    }

    body.dark .filter-tabs {
      background: #0f172a;
    }

    body.dark .filter-btn {
      color: #94a3b8;
    }

    body.dark .filter-btn:hover {
      color: #f8fafc;
    }

    body.dark .filter-btn.active {
      background: #334155;
      color: #f8fafc;
    }

    body.dark .habit-item {
      background: #0f172a;
      border-color: #334155;
    }

    body.dark .habit-item:hover {
      background: #162032;
      border-color: #475569;
    }

    body.dark .habit-item.done {
      background: #042f2e;
      border-color: #115e59;
    }

    body.dark .habit-name {
      color: #f1f5f9;
    }

    body.dark .habit-item.done .habit-name {
      color: #94a3b8;
    }

    body.dark .streak-pill {
      background: #1e293b;
      color: #94a3b8;
    }

    body.dark .streak-pill.active {
      background: #451a03;
      color: #fbbf24;
    }

    body.dark .delete-btn {
      background: #0f172a;
      border-color: #334155;
      color: #64748b;
    }

    body.dark .delete-btn:hover {
      background: #450a0a;
      border-color: #7f1d1d;
      color: #f87171;
    }

    body.dark .edit-btn {
      background: #0f172a;
      border-color: #334155;
      color: #94a3b8;
    }

    body.dark .edit-btn:hover {
      background: #042f2e;
      border-color: #115e59;
      color: #5eead4;
    }

    body.dark .edit-input {
      background: #0f172a;
      color: #f8fafc;
    }

    body.dark .cancel-edit-btn {
      background: #0f172a;
      border-color: #334155;
      color: #cbd5e1;
    }

    body.dark .cancel-edit-btn:hover {
      background: #334155;
    }

    body.dark .empty-state {
      border-color: #334155;
      color: #94a3b8;
    }

    body.dark .celebration {
      background: #064e3b;
      color: #6ee7b7;
    }

    body.dark .footer-actions {
      border-top-color: #334155;
    }

    body.dark .reset-btn {
      background: #0f172a;
      border-color: #334155;
      color: #cbd5e1;
    }

    body.dark .reset-btn:hover:not(:disabled) {
      background: #334155;
      border-color: #475569;
      color: #ffffff;
    }

    body.dark .alarm-banner {
      background: #451a03;
      border-color: #92400e;
      color: #fde68a;
    }

    body.dark .reminders-section {
      border-top-color: #334155;
    }

    body.dark .reminders-title {
      color: #f8fafc;
    }

    body.dark .notify-btn,
    body.dark .reminder-toggle-btn,
    body.dark .reminder-cal-btn {
      background: #0f172a;
      border-color: #334155;
      color: #cbd5e1;
    }

    body.dark .reminder-label-input,
    body.dark .reminder-time-input {
      background: #0f172a;
      border-color: #334155;
      color: #f8fafc;
    }

    body.dark .reminder-item {
      background: #0f172a;
      border-color: #334155;
    }

    body.dark .reminder-time-badge {
      background: #134e4a;
      color: #5eead4;
    }

    body.dark .reminder-name {
      color: #f1f5f9;
    }

    body.dark .reminder-del-btn {
      background: #0f172a;
      border-color: #334155;
      color: #64748b;
    }
  </style>
</head>
<body>
  <!-- HTML: Defines the structure and content on the page -->
  <main class="card">
    <header class="header">
      <div class="header-top">
        <span class="badge">Step 8 • Reminders &amp; Alarms</span>
        <button type="button" id="theme-toggle" class="theme-btn" aria-label="Toggle dark mode">
          🌙 Dark
        </button>
      </div>
      <h1>Sam Personal Tracker</h1>
      <p class="subtitle">Rename any habit anytime without losing your streak.</p>
    </header>

    <div id="alarm-banner" class="alarm-banner" role="alert">
      <span id="alarm-banner-text" class="alarm-banner-text"></span>
      <button type="button" id="dismiss-alarm-btn" class="dismiss-alarm-btn">Dismiss</button>
    </div>

    <section class="progress-wrap" aria-label="Daily progress">
      <div class="progress-label">
        <span>Today's Progress</span>
        <span id="progress-text">0 of 3 done</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progress-fill" class="progress-bar-fill"></div>
      </div>
    </section>

    <form id="add-habit-form" class="add-form">
      <input
        type="text"
        id="habit-input"
        class="add-input"
        placeholder="Add a new habit..."
        aria-label="New habit name"
        maxlength="60"
        required
      />
      <button type="submit" class="add-btn">Add</button>
    </form>

    <div class="filter-tabs" role="tablist" aria-label="Filter habits">
      <button type="button" class="filter-btn active" data-filter="all">All</button>
      <button type="button" class="filter-btn" data-filter="todo">To Do</button>
      <button type="button" class="filter-btn" data-filter="done">Done</button>
    </div>

    <ul id="habit-list" class="habit-list"></ul>

    <div id="celebration" class="celebration">
      All habits completed for today! Great job!
    </div>

    <section class="reminders-section" aria-label="Reminders and Alarms">
      <div class="reminders-header">
        <h2 class="reminders-title">⏰ Reminders &amp; Alarms</h2>
        <div style="display:flex;gap:6px;align-items:center;">
          <button type="button" id="test-alarm-btn" class="notify-btn">Test 10s</button>
          <button type="button" id="notify-permission-btn" class="notify-btn">Enable Alerts</button>
        </div>
      </div>
      <p id="native-status" class="save-status" style="margin-bottom:10px;"></p>

      <form id="reminder-form" class="reminder-form">
        <input
          type="text"
          id="reminder-label-input"
          class="reminder-label-input"
          placeholder="Reminder (e.g. Drink water)"
          maxlength="50"
          required
        />
        <input
          type="time"
          id="reminder-time-input"
          class="reminder-time-input"
          aria-label="Reminder time"
          required
        />
        <button type="submit" class="reminder-add-btn">Set Alarm</button>
      </form>

      <ul id="reminder-list" class="reminder-list"></ul>
    </section>

    <footer class="footer-actions">
      <span id="save-status" class="save-status">Saved automatically</span>
      <button type="button" id="reset-btn" class="reset-btn">Reset Today</button>
    </footer>
  </main>

  <script>
    // JavaScript: Stores the habit data and makes the buttons interactive
    const STORAGE_KEY = "myFirstHabitTracker_v1";
    const THEME_KEY = "myFirstHabitTracker_theme";
    const REMINDERS_KEY = "myFirstHabitTracker_reminders";
    const defaultHabits = [
      { id: 1, name: "Drink 8 glasses of water", done: false, streak: 0 },
      { id: 2, name: "Read for 15 minutes", done: false, streak: 0 },
      { id: 3, name: "Take a 20-minute walk", done: false, streak: 0 }
    ];

    function loadHabits() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { habits: defaultHabits.map((h) => ({ ...h })), nextId: 4 };
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed.habits)) {
          return {
            habits: parsed.habits.map((h) => ({
              ...h,
              streak: typeof h.streak === "number" ? h.streak : 0
            })),
            nextId: typeof parsed.nextId === "number" ? parsed.nextId : parsed.habits.length + 1
          };
        }
      } catch (err) {
        // Fallback if localStorage is blocked or empty
      }
      return { habits: defaultHabits.map((h) => ({ ...h })), nextId: 4 };
    }

    function saveHabits() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ habits, nextId }));
        saveStatusEl.textContent = "Saved automatically";
      } catch (err) {
        saveStatusEl.textContent = "Session-only mode";
      }
    }

    const initialState = loadHabits();
    let habits = initialState.habits;
    let nextId = initialState.nextId;
    let currentFilter = "all";
    let editingId = null;

    const addHabitFormEl = document.getElementById("add-habit-form");
    const filterButtons = document.querySelectorAll(".filter-btn");
    const themeToggleEl = document.getElementById("theme-toggle");

    function applyTheme(theme) {
      const isDark = theme === "dark";
      document.body.classList.toggle("dark", isDark);
      themeToggleEl.textContent = isDark ? "☀️ Light" : "🌙 Dark";
    }

    function loadTheme() {
      try {
        return localStorage.getItem(THEME_KEY) || "light";
      } catch (err) {
        return "light";
      }
    }

    themeToggleEl.addEventListener("click", () => {
      const nextTheme = document.body.classList.contains("dark") ? "light" : "dark";
      applyTheme(nextTheme);
      try {
        localStorage.setItem(THEME_KEY, nextTheme);
      } catch (err) {
        // Ignore storage errors in restricted environments
      }
    });

    applyTheme(loadTheme());
    const habitInputEl = document.getElementById("habit-input");
    const habitListEl = document.getElementById("habit-list");
    const progressTextEl = document.getElementById("progress-text");
    const progressFillEl = document.getElementById("progress-fill");
    const celebrationEl = document.getElementById("celebration");
    const saveStatusEl = document.getElementById("save-status");
    const resetBtnEl = document.getElementById("reset-btn");

    addHabitFormEl.addEventListener("submit", (event) => {
      event.preventDefault();
      const name = habitInputEl.value.trim();
      if (!name) return;

      habits.push({ id: nextId++, name, done: false, streak: 0 });
      habitInputEl.value = "";
      saveHabits();
      renderHabits();
    });

    resetBtnEl.addEventListener("click", () => {
      habits = habits.map((h) => ({ ...h, done: false }));
      saveHabits();
      renderHabits();
    });

    filterButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        currentFilter = btn.dataset.filter;
        filterButtons.forEach((b) => b.classList.toggle("active", b === btn));
        renderHabits();
      });
    });

    function renderHabits() {
      habitListEl.innerHTML = "";

      if (habits.length === 0) {
        const emptyEl = document.createElement("li");
        emptyEl.className = "empty-state";
        emptyEl.textContent = "No habits yet—add one above to get started!";
        habitListEl.appendChild(emptyEl);
        updateProgress();
        return;
      }

      const visibleHabits = habits.filter((habit) => {
        if (currentFilter === "todo") return !habit.done;
        if (currentFilter === "done") return habit.done;
        return true;
      });

      if (visibleHabits.length === 0) {
        const emptyEl = document.createElement("li");
        emptyEl.className = "empty-state";
        emptyEl.textContent =
          currentFilter === "todo"
            ? "Nothing left to do—everything is checked off!"
            : "No habits completed yet today.";
        habitListEl.appendChild(emptyEl);
        updateProgress();
        return;
      }

      visibleHabits.forEach((habit) => {
        const li = document.createElement("li");
        li.className = "habit-row";

        if (habit.id === editingId) {
          const editForm = document.createElement("form");
          editForm.className = "edit-form";

          const editInput = document.createElement("input");
          editInput.type = "text";
          editInput.className = "edit-input";
          editInput.value = habit.name;
          editInput.maxLength = 60;
          editInput.required = true;
          editInput.setAttribute("aria-label", "Edit habit name");

          const saveBtn = document.createElement("button");
          saveBtn.type = "submit";
          saveBtn.className = "save-edit-btn";
          saveBtn.textContent = "Save";

          const cancelBtn = document.createElement("button");
          cancelBtn.type = "button";
          cancelBtn.className = "cancel-edit-btn";
          cancelBtn.textContent = "Cancel";

          editForm.addEventListener("submit", (event) => {
            event.preventDefault();
            const updatedName = editInput.value.trim();
            if (!updatedName) return;
            habit.name = updatedName;
            editingId = null;
            saveHabits();
            renderHabits();
          });

          cancelBtn.addEventListener("click", () => {
            editingId = null;
            renderHabits();
          });

          editInput.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
              editingId = null;
              renderHabits();
            }
          });

          editForm.appendChild(editInput);
          editForm.appendChild(saveBtn);
          editForm.appendChild(cancelBtn);
          li.appendChild(editForm);
          habitListEl.appendChild(li);

          setTimeout(() => {
            editInput.focus();
            editInput.setSelectionRange(editInput.value.length, editInput.value.length);
          }, 0);
          return;
        }

        const toggleBtn = document.createElement("button");
        toggleBtn.type = "button";
        toggleBtn.className = habit.done ? "habit-item done" : "habit-item";
        toggleBtn.setAttribute("aria-pressed", String(habit.done));

        const checkboxEl = document.createElement("span");
        checkboxEl.className = "checkbox";
        checkboxEl.textContent = habit.done ? "✓" : "";

        const nameEl = document.createElement("span");
        nameEl.className = "habit-name";
        nameEl.textContent = habit.name;

        const streakEl = document.createElement("span");
        streakEl.className = habit.streak > 0 ? "streak-pill active" : "streak-pill";
        streakEl.textContent = `🔥 ${habit.streak}d`;

        toggleBtn.appendChild(checkboxEl);
        toggleBtn.appendChild(nameEl);
        toggleBtn.appendChild(streakEl);
        toggleBtn.addEventListener("click", () => {
          if (!habit.done) {
            habit.done = true;
            habit.streak += 1;
          } else {
            habit.done = false;
            habit.streak = Math.max(0, habit.streak - 1);
          }
          saveHabits();
          renderHabits();
        });

        const editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.className = "edit-btn";
        editBtn.setAttribute("aria-label", `Edit ${habit.name}`);
        editBtn.textContent = "✎";
        editBtn.addEventListener("click", () => {
          editingId = habit.id;
          renderHabits();
        });

        const deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "delete-btn";
        deleteBtn.setAttribute("aria-label", `Delete ${habit.name}`);
        deleteBtn.textContent = "×";
        deleteBtn.addEventListener("click", () => {
          habits = habits.filter((h) => h.id !== habit.id);
          saveHabits();
          renderHabits();
        });

        li.appendChild(toggleBtn);
        li.appendChild(editBtn);
        li.appendChild(deleteBtn);
        habitListEl.appendChild(li);
      });

      updateProgress();
    }

    function updateProgress() {
      const completedCount = habits.filter((h) => h.done).length;
      const totalCount = habits.length;
      const percent = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;

      progressTextEl.textContent = `${completedCount} of ${totalCount} done`;
      progressFillEl.style.width = `${percent}%`;

      resetBtnEl.disabled = completedCount === 0;

      if (totalCount > 0 && completedCount === totalCount) {
        celebrationEl.classList.add("visible");
      } else {
        celebrationEl.classList.remove("visible");
      }
    }

    // --- Reminders & Alarm Logic ---
    function loadReminders() {
      try {
        const raw = localStorage.getItem(REMINDERS_KEY);
        if (!raw) return { reminders: [], nextReminderId: 1 };
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed.reminders)) {
          return {
            reminders: parsed.reminders,
            nextReminderId: typeof parsed.nextReminderId === "number" ? parsed.nextReminderId : parsed.reminders.length + 1
          };
        }
      } catch (err) {
        // Fallback if localStorage is unavailable
      }
      return { reminders: [], nextReminderId: 1 };
    }

    function saveReminders() {
      try {
        localStorage.setItem(REMINDERS_KEY, JSON.stringify({ reminders, nextReminderId }));
      } catch (err) {
        // Ignore storage errors
      }
    }

    const initialReminders = loadReminders();
    let reminders = initialReminders.reminders;
    let nextReminderId = initialReminders.nextReminderId;
    let activeAlarmTimer = null;

    const reminderFormEl = document.getElementById("reminder-form");
    const reminderLabelInputEl = document.getElementById("reminder-label-input");
    const reminderTimeInputEl = document.getElementById("reminder-time-input");
    const reminderListEl = document.getElementById("reminder-list");
    const alarmBannerEl = document.getElementById("alarm-banner");
    const alarmBannerTextEl = document.getElementById("alarm-banner-text");
    const dismissAlarmBtnEl = document.getElementById("dismiss-alarm-btn");
    const notifyPermissionBtnEl = document.getElementById("notify-permission-btn");
    const testAlarmBtnEl = document.getElementById("test-alarm-btn");
    const nativeStatusEl = document.getElementById("native-status");

    async function ensureNativeChannel(LN) {
      try {
        await LN.createChannel({
          id: "sam_alarms",
          name: "Habit Alarms",
          description: "Daily habit reminder alarms",
          importance: 5,
          visibility: 1,
          vibration: true
        });
      } catch (err) {
        // Ignore if channel already exists or unsupported
      }
    }

    async function scheduleNativeAlarm(reminder, secondsOverride = null) {
      const LN = window.Capacitor?.Plugins?.LocalNotifications;
      if (!LN) {
        nativeStatusEl.textContent = "Browser mode (keep tab open for alarms)";
        return;
      }
      try {
        const perm = await LN.requestPermissions();
        if (perm.display !== "granted") {
          nativeStatusEl.textContent = "Please allow Notifications in phone Settings";
          return;
        }
        await ensureNativeChannel(LN);

        let triggerDate;
        if (secondsOverride) {
          triggerDate = new Date(Date.now() + secondsOverride * 1000);
        } else {
          const [hour, minute] = reminder.time.split(":").map(Number);
          const now = new Date();
          triggerDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hour, minute, 0, 0);
          if (triggerDate <= now) {
            triggerDate.setDate(triggerDate.getDate() + 1);
          }
        }

        const notif = {
          id: reminder.id,
          title: "Sam Personal Tracker",
          body: reminder.label,
          channelId: "sam_alarms",
          schedule: secondsOverride
            ? { at: triggerDate, allowWhileIdle: true }
            : { at: triggerDate, allowWhileIdle: true, repeats: true, every: "day" }
        };

        await LN.schedule({ notifications: [notif] });
        nativeStatusEl.textContent = secondsOverride
          ? "10s test alarm set — close app now!"
          : `Native alarm saved for ${formatTime12h(reminder.time)}`;
      } catch (err) {
        nativeStatusEl.textContent = "Alarm error: " + (err?.message || "check permissions");
      }
    }

    async function cancelNativeAlarm(id) {
      const LN = window.Capacitor?.Plugins?.LocalNotifications;
      if (!LN) return;
      try {
        await LN.cancel({ notifications: [{ id }] });
      } catch (err) {}
    }

    testAlarmBtnEl.addEventListener("click", () => {
      scheduleNativeAlarm({ id: 99999, label: "Test Alarm — It works!", time: "12:00" }, 10);
    });

    function updateNotifyButton() {
      if (!("Notification" in window)) {
        notifyPermissionBtnEl.textContent = "In-App Alerts";
        notifyPermissionBtnEl.disabled = true;
        return;
      }
      if (Notification.permission === "granted") {
        notifyPermissionBtnEl.textContent = "Alerts On";
      } else if (Notification.permission === "denied") {
        notifyPermissionBtnEl.textContent = "Alerts Blocked";
      } else {
        notifyPermissionBtnEl.textContent = "Enable Alerts";
      }
    }

    notifyPermissionBtnEl.addEventListener("click", () => {
      if (!("Notification" in window)) return;
      try {
        Notification.requestPermission().then(() => updateNotifyButton());
      } catch (err) {
        // Ignore if browser blocks permission prompt
      }
    });

    function playChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const notes = [880, 1174.66, 880, 1174.66];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "triangle";
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.95, ctx.currentTime + idx * 0.18);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.18 + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.18);
          osc.stop(ctx.currentTime + idx * 0.18 + 0.26);
        });
      } catch (err) {
        // Ignore audio errors before user gesture
      }
    }

    function downloadReminderICS(reminder) {
      const [hStr, mStr] = reminder.time.split(":");
      const now = new Date();
      const target = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate(),
        parseInt(hStr, 10),
        parseInt(mStr, 10),
        0
      );
      if (target <= now) {
        target.setDate(target.getDate() + 1);
      }

      const pad = (n) => String(n).padStart(2, "0");
      const formatICSDate = (d) =>
        `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;

      const end = new Date(target.getTime() + 15 * 60000);
      const safeTitle = reminder.label.replace(/[,;\n]/g, " ");
      const icsContent = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//Sam Personal Tracker//EN",
        "BEGIN:VEVENT",
        `UID:sam-tracker-${reminder.id}@local`,
        `DTSTAMP:${formatICSDate(new Date())}`,
        `DTSTART:${formatICSDate(target)}`,
        `DTEND:${formatICSDate(end)}`,
        "RRULE:FREQ=DAILY",
        `SUMMARY:${safeTitle}`,
        "BEGIN:VALARM",
        "TRIGGER:-PT0M",
        "ACTION:DISPLAY",
        `DESCRIPTION:${safeTitle}`,
        "END:VALARM",
        "END:VEVENT",
        "END:VCALENDAR"
      ].join("\r\n");

      const blob = new Blob([icsContent], { type: "text/calendar;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `reminder-${reminder.id}.ics`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function formatTime12h(time24) {
      const [hStr, mStr] = time24.split(":");
      let h = parseInt(hStr, 10);
      const ampm = h >= 12 ? "PM" : "AM";
      h = h % 12 || 12;
      return `${h}:${mStr} ${ampm}`;
    }

    function triggerAlarm(reminder) {
      alarmBannerTextEl.textContent = `⏰ Alarm: ${reminder.label} (${formatTime12h(reminder.time)})`;
      alarmBannerEl.classList.add("visible");
      playChime();
      if (activeAlarmTimer) clearInterval(activeAlarmTimer);
      activeAlarmTimer = setInterval(playChime, 2200);

      if ("Notification" in window && Notification.permission === "granted") {
        try {
          new Notification("Habit Tracker Reminder", {
            body: `${reminder.label} — ${formatTime12h(reminder.time)}`
          });
        } catch (err) {
          // Ignore notification errors
        }
      }
    }

    dismissAlarmBtnEl.addEventListener("click", () => {
      alarmBannerEl.classList.remove("visible");
      if (activeAlarmTimer) {
        clearInterval(activeAlarmTimer);
        activeAlarmTimer = null;
      }
    });

    reminderFormEl.addEventListener("submit", (event) => {
      event.preventDefault();
      const label = reminderLabelInputEl.value.trim();
      const time = reminderTimeInputEl.value;
      if (!label || !time) return;

      const newReminder = {
        id: nextReminderId++,
        label,
        time,
        enabled: true,
        lastTriggeredDate: ""
      };
      reminders.push(newReminder);
      reminderLabelInputEl.value = "";
      saveReminders();
      scheduleNativeAlarm(newReminder);
      renderReminders();
    });

    function renderReminders() {
      reminderListEl.innerHTML = "";

      if (reminders.length === 0) {
        const emptyEl = document.createElement("li");
        emptyEl.className = "reminder-empty";
        emptyEl.textContent = "No reminders set yet.";
        reminderListEl.appendChild(emptyEl);
        return;
      }

      reminders.forEach((reminder) => {
        const li = document.createElement("li");
        li.className = reminder.enabled ? "reminder-item" : "reminder-item paused";

        const infoEl = document.createElement("div");
        infoEl.className = "reminder-info";

        const timeBadge = document.createElement("span");
        timeBadge.className = "reminder-time-badge";
        timeBadge.textContent = formatTime12h(reminder.time);

        const nameEl = document.createElement("span");
        nameEl.className = "reminder-name";
        nameEl.textContent = reminder.label;

        infoEl.appendChild(timeBadge);
        infoEl.appendChild(nameEl);

        const actionsEl = document.createElement("div");
        actionsEl.className = "reminder-actions";

        const toggleBtn = document.createElement("button");
        toggleBtn.type = "button";
        toggleBtn.className = "reminder-toggle-btn";
        toggleBtn.textContent = reminder.enabled ? "On" : "Paused";
        toggleBtn.addEventListener("click", () => {
          reminder.enabled = !reminder.enabled;
          if (reminder.enabled) {
            scheduleNativeAlarm(reminder);
          } else {
            cancelNativeAlarm(reminder.id);
          }
          saveReminders();
          renderReminders();
        });

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "reminder-del-btn";
        delBtn.setAttribute("aria-label", `Delete reminder ${reminder.label}`);
        delBtn.textContent = "×";
        delBtn.addEventListener("click", () => {
          cancelNativeAlarm(reminder.id);
          reminders = reminders.filter((r) => r.id !== reminder.id);
          saveReminders();
          renderReminders();
        });

        const calBtn = document.createElement("button");
        calBtn.type = "button";
        calBtn.className = "reminder-cal-btn";
        calBtn.title = "Save to phone Calendar so it rings even when closed";
        calBtn.textContent = "📅";
        calBtn.addEventListener("click", () => downloadReminderICS(reminder));

        actionsEl.appendChild(calBtn);
        actionsEl.appendChild(toggleBtn);
        actionsEl.appendChild(delBtn);
        li.appendChild(infoEl);
        li.appendChild(actionsEl);
        reminderListEl.appendChild(li);
      });
    }

    function checkReminders() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      const currentTime = `${hh}:${mm}`;
      const todayKey = now.toISOString().slice(0, 10);

      let changed = false;
      reminders.forEach((reminder) => {
        if (reminder.enabled && reminder.time === currentTime && reminder.lastTriggeredDate !== todayKey) {
          reminder.lastTriggeredDate = todayKey;
          changed = true;
          triggerAlarm(reminder);
        }
      });
      if (changed) saveReminders();
    }

    setInterval(checkReminders, 1000);
    updateNotifyButton();
    renderReminders();

    // Draw the initial list when the page loads
    renderHabits();
  </script>
</body>
</html>
