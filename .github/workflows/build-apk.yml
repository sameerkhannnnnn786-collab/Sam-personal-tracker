name: Build Sam Personal Tracker APK

on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Organize folders
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp icon.png icon-only.png assets/

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        run: |
          npm install -D @capacitor/assets
          npx capacitor-assets generate --android

      - name: Add Native AlarmClock Plugin & Custom Ringtone
        run: |
          python3 - << 'EOF'
          import os
          pkg_dir = "android/app/src/main/java/com/sam/personaltracker"
          os.makedirs(pkg_dir, exist_ok=True)

          receiver_java = '''package com.sam.personaltracker;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.MediaPlayer;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import androidx.core.app.NotificationCompat;
          import java.io.File;

          public class AlarmReceiver extends BroadcastReceiver {
              public static final String ACTION_STOP = "com.sam.personaltracker.STOP_ALARM";
              private static MediaPlayer player;

              public static synchronized void stopRingtone() {
                  if (player != null) {
                      try {
                          if (player.isPlaying()) player.stop();
                          player.release();
                      } catch (Exception ignored) {}
                      player = null;
                  }
              }

              private static synchronized void startRingtone(Context ctx, boolean useCustom) {
                  stopRingtone();
                  try {
                      player = new MediaPlayer();
                      player.setAudioAttributes(new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_ALARM)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build());
                      File customFile = new File(ctx.getFilesDir(), "custom_alarm.audio");
                      if (useCustom && customFile.exists()) {
                          player.setDataSource(customFile.getAbsolutePath());
                      } else {
                          Uri uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM);
                          if (uri == null) uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                          player.setDataSource(ctx, uri);
                      }
                      player.setLooping(true);
                      player.prepare();
                      player.start();
                      new Handler(Looper.getMainLooper()).postDelayed(AlarmReceiver::stopRingtone, 45000);
                  } catch (Exception ignored) {}
              }

              @Override
              public void onReceive(Context context, Intent intent) {
                  int id = intent.getIntExtra("id", 1);
                  NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (ACTION_STOP.equals(intent.getAction())) {
                      stopRingtone();
                      if (nm != null) nm.cancel(id);
                      return;
                  }

                  String label = intent.getStringExtra("label");
                  if (label == null || label.isEmpty()) label = "Time for your habit!";
                  boolean useCustom = intent.getBooleanExtra("useCustom", false);
                  startRingtone(context, useCustom);

                  String chId = "sam_alarm_clock";
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && nm != null) {
                      NotificationChannel ch = new NotificationChannel(chId, "Habit Alarm Clock", NotificationManager.IMPORTANCE_HIGH);
                      ch.setSound(null, null);
                      ch.enableVibration(true);
                      nm.createNotificationChannel(ch);
                  }

                  Intent openIntent = new Intent(context, MainActivity.class);
                  openIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent openPi = PendingIntent.getActivity(context, id, openIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  Intent stopIntent = new Intent(context, AlarmReceiver.class);
                  stopIntent.setAction(ACTION_STOP);
                  stopIntent.putExtra("id", id);
                  PendingIntent stopPi = PendingIntent.getBroadcast(context, id + 10000, stopIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  NotificationCompat.Builder b = new NotificationCompat.Builder(context, chId)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentTitle("Sam Personal Tracker")
                      .setContentText(label)
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setCategory(NotificationCompat.CATEGORY_ALARM)
                      .setAutoCancel(true)
                      .setContentIntent(openPi)
                      .setDeleteIntent(stopPi)
                      .addAction(0, "Stop Alarm", stopPi);

                  if (nm != null) nm.notify(id, b.build());
              }
          }
          '''

          plugin_java = '''package com.sam.personaltracker;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.util.Base64;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;

          @CapacitorPlugin(name = "NativeAlarm")
          public class AlarmPlugin extends Plugin {
              @PluginMethod
              public void saveCustomRingtone(PluginCall call) {
                  try {
                      String base64 = call.getString("base64", "");
                      byte[] data = Base64.decode(base64, Base64.DEFAULT);
                      File out = new File(getContext().getFilesDir(), "custom_alarm.audio");
                      try (FileOutputStream fos = new FileOutputStream(out)) {
                          fos.write(data);
                      }
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("Could not save ringtone: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void setAlarm(PluginCall call) {
                  int id = call.getInt("id", 1);
                  long triggerAtMs = call.getDouble("triggerAtMs", (double) System.currentTimeMillis()).longValue();
                  String label = call.getString("label", "Habit Reminder");
                  boolean useCustom = Boolean.TRUE.equals(call.getBoolean("useCustom", false));

                  Context ctx = getContext();
                  AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                  Intent intent = new Intent(ctx, AlarmReceiver.class);
                  intent.putExtra("id", id);
                  intent.putExtra("label", label);
                  intent.putExtra("useCustom", useCustom);
                  PendingIntent pi = PendingIntent.getBroadcast(ctx, id, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  Intent showIntent = new Intent(ctx, MainActivity.class);
                  PendingIntent showPi = PendingIntent.getActivity(ctx, 0, showIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  if (am != null) {
                      am.setAlarmClock(new AlarmManager.AlarmClockInfo(triggerAtMs, showPi), pi);
                  }
                  call.resolve();
              }

              @PluginMethod
              public void cancelAlarm(PluginCall call) {
                  int id = call.getInt("id", 1);
                  Context ctx = getContext();
                  AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                  Intent intent = new Intent(ctx, AlarmReceiver.class);
                  PendingIntent pi = PendingIntent.getBroadcast(ctx, id, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  if (am != null) am.cancel(pi);
                  call.resolve();
              }

              @PluginMethod
              public void stopAlarm(PluginCall call) {
                  AlarmReceiver.stopRingtone();
                  call.resolve();
              }
          }
          '''

          main_java = '''package com.sam.personaltracker;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AlarmPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          '''

          open(os.path.join(pkg_dir, "AlarmReceiver.java"), "w").write(receiver_java)
          open(os.path.join(pkg_dir, "AlarmPlugin.java"), "w").write(plugin_java)
          open(os.path.join(pkg_dir, "MainActivity.java"), "w").write(main_java)

          mp = "android/app/src/main/AndroidManifest.xml"
          ms = open(mp).read()
          perms = '''    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />'''
          if "USE_EXACT_ALARM" not in ms:
              ms = ms.replace("<application", perms + "\n    <application", 1)
          if "AlarmReceiver" not in ms:
              ms = ms.replace("</application>", '        <receiver android:name=".AlarmReceiver" android:exported="false" />\n    </application>', 1)
          open(mp, "w").write(ms)
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sam-personal-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
