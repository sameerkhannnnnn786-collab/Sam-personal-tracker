name: Build Sam Personal Tracker APK

on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        run: |
          npm install -D @capacitor/assets
          npx capacitor-assets generate --android

      - name: Add Android alarm & notification permissions
        run: |
          python3 - << 'EOF'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          perms = '''    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'''
          if "SCHEDULE_EXACT_ALARM" not in s:
              s = s.replace("<application", perms + "\n    <application", 1)
              open(p, "w").write(s)
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sam-personal-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
